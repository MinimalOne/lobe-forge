name: release

# On each push to main: release plugin.json's version if it was bumped by hand, otherwise bump it
# from conventional commits on shipped files (see scripts/release.py), then tag and publish.
on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write  # start the ghcr image build for a new release

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main  # not the pushed sha: a queued run must see the previous run's release commit
          fetch-depth: 0

      - run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - run: python3 test_forge.py
      - run: python3 server/test_server.py
      - run: python3 test_wiki_tool.py

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

      - id: next
        run: python3 scripts/release.py --notes "$RUNNER_TEMP/notes.md" >> "$GITHUB_OUTPUT"

      - if: steps.next.outputs.version
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.next.outputs.version }}
        run: |
          if ! git diff --quiet; then
            git commit -qam "chore: release v$V"
            git push origin HEAD:main
          fi
          gh release create "v$V" --target "$(git rev-parse HEAD)" --title "v$V" --notes-file "$RUNNER_TEMP/notes.md"
          # Releases made with GITHUB_TOKEN start no workflows; workflow_dispatch is the exception.
          gh workflow run ghcr.yml --ref "v$V"
