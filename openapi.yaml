openapi: 3.1.0
info:
  title: lobe-server API
  version: 2.3.0
  description: |
    Self-hosted REST API and Model Context Protocol (MCP) server for managing
    git-backed `lobe-forge` LLM wikis with local-first Git commits and optional remote push.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8080
    description: Local lobe-server instance

security:
  - bearerAuth: []
  - {}

paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check
      description: Public health check endpoint (does not require Bearer authentication).
      security: []
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok

  /api/lobes:
    get:
      operationId: listLobes
      summary: List all hosted lobes
      responses:
        "200":
          description: List of lobes and their Git configuration
          content:
            application/json:
              schema:
                type: object
                required: [lobes]
                properties:
                  lobes:
                    type: array
                    items:
                      $ref: "#/components/schemas/LobeSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      operationId: createLobe
      summary: Create a new git-backed lobe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLobeRequest"
      responses:
        "201":
          description: Lobe created and initialized with a local Git commit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateLobeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/lobes/{lobe}/skills:
    parameters:
      - $ref: "#/components/parameters/LobeName"
    get:
      operationId: generateLobeSkills
      summary: Generate the four lobe-named skills (<name>-add-raw, <name>-ingest, <name>-ask, <name>-lint)
      parameters:
        - name: mode
          in: query
          required: false
          description: Skill template mode (`mcp` for remote MCP skills, `local` for local wikictl skills)
          schema:
            type: string
            enum: [mcp, local]
            default: mcp
      responses:
        "200":
          description: Rendered SKILL.md files and client installation instructions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateSkillsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/lobes/{lobe}/remote:
    parameters:
      - $ref: "#/components/parameters/LobeName"
    put:
      operationId: configureLobeRemote
      summary: Configure or remove optional remote Git URL and auto-push for a lobe
      description: |
        When `remote_url` is set, the server verifies repository access (`git ls-remote`,
        using `LOBE_GIT_TOKEN` for HTTPS PAT auth or host SSH keys) before saving.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigureRemoteRequest"
      responses:
        "200":
          description: Updated remote configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigureRemoteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/lobes/{lobe}/sync:
    parameters:
      - $ref: "#/components/parameters/LobeName"
    post:
      operationId: syncLobe
      summary: Pull latest changes (`git pull --rebase`) from `origin` and optionally push local commits
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncLobeRequest"
      responses:
        "200":
          description: Lobe synchronized with `origin`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncLobeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/lobes/{lobe}/search:
    parameters:
      - $ref: "#/components/parameters/LobeName"
    get:
      operationId: searchLobe
      summary: Search a lobe wiki using BM25F field-weighted ranking and recency decay
      parameters:
        - name: q
          in: query
          required: true
          description: Search terms or regex alternations (repeat `q` for multiple concepts)
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: no_decay
          in: query
          required: false
          description: Disable recency decay weighting on `last_updated`
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Search output from wiki_tool.py
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WikiToolOutput"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/lobes/{lobe}/sections:
    parameters:
      - $ref: "#/components/parameters/LobeName"
    get:
      operationId: listLobeSections
      summary: List `##` sections in the lobe's `wiki/index.md`
      responses:
        "200":
          description: Sections output from wiki_tool.py
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WikiToolOutput"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/lobes/{lobe}/pending:
    parameters:
      - $ref: "#/components/parameters/LobeName"
    get:
      operationId: listPendingRawSources
      summary: List raw sources in `raw/` that no wiki page cites yet
      responses:
        "200":
          description: Pending sources output from wiki_tool.py
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WikiToolOutput"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/lobes/{lobe}/lint:
    parameters:
      - $ref: "#/components/parameters/LobeName"
    get:
      operationId: lintLobe
      summary: Audit lobe wiki for frontmatter, page types, staleness, broken links, orphans, index drift, and missing sources
      parameters:
        - name: strict
          in: query
          required: false
          description: Exit non-zero only on hard errors
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Lint audit output from wiki_tool.py
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WikiToolOutput"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/lobes/{lobe}/links/{page}:
    parameters:
      - $ref: "#/components/parameters/LobeName"
      - name: page
        in: path
        required: true
        description: Wiki page slug
        schema:
          type: string
    get:
      operationId: getPageLinks
      summary: List outgoing and incoming links for a wiki page
      responses:
        "200":
          description: Links output from wiki_tool.py
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WikiToolOutput"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/lobes/{lobe}/raw:
    parameters:
      - $ref: "#/components/parameters/LobeName"
    post:
      operationId: addRawSource
      summary: Save a raw source file in `raw/` and commit locally (with optional remote push)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddRawRequest"
      responses:
        "201":
          description: Raw source saved and committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddRawResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/lobes/{lobe}/raw/{filename}:
    parameters:
      - $ref: "#/components/parameters/LobeName"
      - name: filename
        in: path
        required: true
        description: Filename inside the lobe's raw folder, or a path inside it such as `sub/notes.md` or `docs/sub/notes.md` as `lobe_pending` prints it
        schema:
          type: string
    get:
      operationId: readRawSource
      summary: Read a raw source file from the lobe's `raw/` folder
      responses:
        "200":
          description: Raw source file content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadRawResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/lobes/{lobe}/pages/{slug}:
    parameters:
      - $ref: "#/components/parameters/LobeName"
      - name: slug
        in: path
        required: true
        description: Lowercase hyphenated wiki page slug (without `.md`)
        schema:
          type: string
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
    get:
      operationId: readWikiPage
      summary: Read a Markdown page from the lobe's `wiki/` folder, or one section or line range of it
      parameters:
        - name: section
          in: query
          required: false
          description: Return only this `## ` section (heading text, case-insensitive)
          schema:
            type: string
        - name: start_line
          in: query
          required: false
          description: First line to return (1-based, counts frontmatter)
          schema:
            type: integer
            minimum: 1
        - name: end_line
          in: query
          required: false
          description: Last line to return (inclusive)
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Wiki page content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadPageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      operationId: writeWikiPage
      summary: Create or update a wiki page, optionally add to `index.md`, and commit locally
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WritePageRequest"
      responses:
        "200":
          description: Page written and committed locally (with optional remote push)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WritePageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

    patch:
      operationId: editWikiPage
      summary: Change part of an existing wiki page and commit once
      description: |
        Applies `edits` in order. If any edit fails, none are applied. Returns `409` when
        `expected_sha` no longer matches the page.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditPageRequest"
      responses:
        "200":
          description: Page edited and committed locally (with optional remote push)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WritePageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/lobes/{lobe}/pages/{slug}/verify:
    parameters:
      - $ref: "#/components/parameters/LobeName"
      - name: slug
        in: path
        required: true
        description: Lowercase hyphenated wiki page slug (without `.md`)
        schema:
          type: string
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
    get:
      operationId: getVerifyWikiPage
      summary: Get verification status or HTML verification confirmation page
      description: |
        Send `Accept: text/html` for a page with a one-click verify form. A browser cannot send a
        Bearer header, so this route alone also accepts the token as `?token=`; the page then posts
        it back in the form body, never the URL.
      parameters:
        - name: token
          in: query
          required: false
          description: Bearer token for browsers (this route only)
          schema:
            type: string
      responses:
        "200":
          description: Verification status or HTML page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyStatusResponse"
            text/html:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      operationId: verifyWikiPage
      summary: Stamp human verification on a wiki page pinned by expected_hash
      description: |
        Requires a human credential (`LOBE_HUMAN_TOKEN`, an OAuth token from `LOBE_HUMAN_CLIENT_ID`,
        or one with `LOBE_HUMAN_SCOPE`); the agent token gets 403. There is no MCP equivalent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyPageRequest"
          application/x-www-form-urlencoded:
            schema:
              allOf:
                - $ref: "#/components/schemas/VerifyPageRequest"
                - type: object
                  properties:
                    token:
                      type: string
                      description: Bearer token, when the browser form cannot send a header
      responses:
        "200":
          description: Page verified and committed locally
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyPageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /mcp:
    post:
      operationId: handleMcpJsonRpc
      summary: Model Context Protocol (MCP) Streamable HTTP JSON-RPC 2.0 endpoint
      description: |
        Accepts JSON-RPC 2.0 MCP requests (`initialize`, `notifications/initialized`,
        `ping`, `tools/list`, `tools/call`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonRpcRequest"
      responses:
        "200":
          description: JSON-RPC 2.0 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonRpcResponse"
        "202":
          description: JSON-RPC notification accepted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Optional API token configured via `LOBE_API_TOKEN` environment variable.

  parameters:
    LobeName:
      name: lobe
      in: path
      required: true
      description: Lobe name (e.g. `hack`, `personal`) — lowercase letters, digits and hyphens, starting with a letter, at most 30 characters
      schema:
        type: string
        pattern: "^[a-z][a-z0-9-]{0,29}$"

  responses:
    BadRequest:
      description: Invalid request parameters or payload
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid Bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Lobe, page, or endpoint not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Operation failed due to conflict or command error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Action forbidden (e.g. human verification credential required)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    GitCommitStatus:
      type: object
      required: [committed, commit, remote, pushed, push_error]
      properties:
        committed:
          type: boolean
          description: True if a new local Git commit was created
        commit:
          type: [string, "null"]
          description: Short Git commit hash of HEAD
          example: "8d7c95b"
        remote:
          type: [string, "null"]
          description: Configured `origin` remote URL, or null if local-only
        pushed:
          type: boolean
          description: True if changes were pushed to `origin`
        push_error:
          type: [string, "null"]
          description: Error output if `git push` failed, otherwise null

    LobeSummary:
      type: object
      required: [name, purpose, repo, remote, autopush]
      properties:
        name:
          type: string
          example: hack
        purpose:
          type: string
          example: Device and home-network tinkering
        repo:
          type: string
          example: /data/lobes/hack
        remote:
          type: [string, "null"]
          example: git@github.com:user/hack.git
        autopush:
          type: boolean
          example: false

    CreateLobeRequest:
      type: object
      required: [name, purpose]
      properties:
        name:
          type: string
          pattern: "^[a-z][a-z0-9-]{0,29}$"
          example: personal
        purpose:
          type: string
          example: Personal notes, plans, and documents
        remote_url:
          type: [string, "null"]
          description: Optional remote Git repository URL (`origin`)
        autopush:
          type: [boolean, "null"]
          description: Automatically push local commits to `origin`. Omit or null to follow the server default (`LOBE_GIT_PUSH`); a value set here overrides it for this lobe.
        generate_skills:
          type: boolean
          default: false
          description: Whether to also return the four rendered `<name>-*` SKILL.md files in the response
        skill_mode:
          type: string
          enum: [mcp, local]
          default: mcp
          description: Skill template mode when `generate_skills` is true (`mcp` or `local`)

    GenerateSkillsResponse:
      type: object
      required: [lobe, purpose, mode, skill_names, skills, install_instructions]
      properties:
        lobe:
          type: string
        purpose:
          type: string
        mode:
          type: string
          enum: [mcp, local]
        skill_names:
          type: array
          items:
            type: string
        skills:
          type: object
          additionalProperties:
            type: string
          description: Map of `<skill-name>/SKILL.md` to rendered Markdown content
        install_instructions:
          type: string

    CreateLobeResponse:
      allOf:
        - type: object
          required: [name, purpose, repo, cloned]
          properties:
            name:
              type: string
            purpose:
              type: string
            repo:
              type: string
            cloned:
              type: boolean
              description: True if an existing non-empty remote repository was cloned
        - $ref: "#/components/schemas/GitCommitStatus"

    ConfigureRemoteRequest:
      type: object
      properties:
        remote_url:
          type: [string, "null"]
          description: Remote Git URL (`origin`), or null/empty to remove remote
          example: https://github.com/user/personal.git
        autopush:
          type: [boolean, "null"]
          default: true
          description: Automatically push after local commits when remote is set. `null` removes the lobe's own setting, so it follows the server default (`LOBE_GIT_PUSH`).

    ConfigureRemoteResponse:
      type: object
      required: [lobe, remote, autopush]
      properties:
        lobe:
          type: string
        remote:
          type: [string, "null"]
        autopush:
          type: boolean

    SyncLobeRequest:
      type: object
      properties:
        push:
          type: boolean
          default: true
          description: Push local commits after pulling from `origin`

    SyncLobeResponse:
      type: object
      required: [lobe, remote, pulled, pushed, commit]
      properties:
        lobe:
          type: string
        remote:
          type: string
        pulled:
          type: boolean
          description: True if `git pull --rebase` ran against an upstream branch
        pushed:
          type: boolean
          description: True if `git push` ran and succeeded
        commit:
          type: [string, "null"]
          description: Short Git commit hash of HEAD after sync

    WikiToolOutput:
      type: object
      required: [returncode, stdout, stderr]
      properties:
        returncode:
          type: integer
          example: 0
        stdout:
          type: string
        stderr:
          type: string

    AddRawRequest:
      type: object
      required: [filename, content]
      properties:
        filename:
          type: string
          example: 2026-10-30-notes.md
        content:
          type: string

    AddRawResponse:
      allOf:
        - type: object
          required: [lobe, path]
          properties:
            lobe:
              type: string
            path:
              type: string
              example: raw/2026-10-30-notes.md
        - $ref: "#/components/schemas/GitCommitStatus"

    ReadRawResponse:
      type: object
      required: [lobe, filename, path, content]
      properties:
        lobe:
          type: string
        filename:
          type: string
        path:
          type: string
          example: raw/2026-10-30-notes.md
        content:
          type: string

    ReadPageResponse:
      type: object
      required: [lobe, slug, path, sha, lines, content]
      properties:
        lobe:
          type: string
        slug:
          type: string
        path:
          type: string
          example: wiki/lobe-server-pi5.md
        sha:
          type: string
          description: Short SHA-256 of the whole page; pass as `expected_sha` to guard a later write
        lines:
          type: integer
          description: Total lines in the page
        start_line:
          type: integer
          description: First returned line, present only for a section or line-range read
        end_line:
          type: integer
          description: Last returned line, present only for a section or line-range read
        sections:
          type: array
          items:
            type: string
          description: The page's `## ` headings, present only for a section or line-range read
        content:
          type: string

    WritePageRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          description: Full Markdown content including YAML frontmatter
        section:
          type: string
          description: Optional `wiki/index.md` section heading to register the page under
        description:
          type: string
          description: Optional <=25-word description for `wiki/index.md`
        log_entry:
          type: string
          description: Optional markdown block to append to `wiki/log.md` in the same commit
        expected_sha:
          type: string
          description: '`sha` from a read; the write fails with 409 if the page changed since'
        actor:
          type: string
          description: Optional actor identity for generated.by (defaults to 'mcp-client')

    PageEdit:
      type: object
      required: [op, content]
      properties:
        op:
          type: string
          enum: [find_replace, append, replace_section]
        content:
          type: string
          description: Replacement or appended text
        find:
          type: string
          description: "find_replace: exact text to replace"
        expected_count:
          type: integer
          default: 1
          description: "find_replace: required number of matches"
        section:
          type: string
          description: "append / replace_section: `## ` heading text"

    EditPageRequest:
      type: object
      required: [edits]
      properties:
        edits:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PageEdit"
        expected_sha:
          type: string
          description: '`sha` from a read; the edit fails with 409 if the page changed since'
        log_entry:
          type: string
          description: Optional markdown block to append to `wiki/log.md` in the same commit
        index_section:
          type: string
          description: With `index_description`, add the page to this `wiki/index.md` section
        index_description:
          type: string
          description: Optional <=25-word description for `wiki/index.md`
        actor:
          type: string
          description: Optional actor identity for generated.by (defaults to 'mcp-client')

    WritePageResponse:
      allOf:
        - type: object
          required: [lobe, slug, created]
          properties:
            lobe:
              type: string
            slug:
              type: string
            created:
              type: boolean
            sha:
              type: string
              description: Short SHA-256 of the page after the write
        - $ref: "#/components/schemas/GitCommitStatus"

    VerifyPageRequest:
      type: object
      required: [expected_hash]
      properties:
        expected_hash:
          type: string
          description: '`hash` from GET .../verify (page content without trust fields); not the `sha` from a page read'
        by:
          type: string
          description: Reviewer name (e.g. 'jijin'), used only with a shared credential; an OAuth token's own identity wins

    VerifyPageResponse:
      allOf:
        - type: object
          required: [lobe, slug, sha, verified]
          properties:
            lobe:
              type: string
            slug:
              type: string
            sha:
              type: string
              description: Short SHA-256 of the page after verification
            verified:
              type: object
              required: [by, at, sha]
              properties:
                by:
                  type: string
                at:
                  type: string
                sha:
                  type: string
        - $ref: "#/components/schemas/GitCommitStatus"

    VerifyStatusResponse:
      type: object
      required: [lobe, slug, hash, is_verified, is_stale]
      properties:
        lobe:
          type: string
        slug:
          type: string
        hash:
          type: string
          description: Current page_hash (content without trust fields); pass as `expected_hash` to verify
        verified:
          type: object
          nullable: true
          properties:
            by:
              type: string
            at:
              type: string
            sha:
              type: string
        is_verified:
          type: boolean
        is_stale:
          type: boolean

    JsonRpcRequest:
      type: object
      required: [jsonrpc, method]
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        id:
          type: [integer, string]
        method:
          type: string
          example: tools/call
        params:
          type: object
          additionalProperties: true

    JsonRpcResponse:
      type: object
      required: [jsonrpc, id]
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        id:
          type: [integer, string, "null"]
        result:
          type: object
          additionalProperties: true
        error:
          type: object
          properties:
            code:
              type: integer
            message:
              type: string
